name: VST3

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["plugin/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["plugin/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/plugin/_deps
          key: juce-8.0.8-${{ runner.os }}
      - name: Configure
        run: cmake -S plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/plugin --config Release --parallel 2
      - name: Check VST3 bundle
        shell: bash
        run: |
          plugin=$(find build/plugin -type d -name '*.vst3' | head -1)
          test -n "$plugin"
          test -f "$plugin/Contents/Resources/moduleinfo.json"
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: AruraMelody-${{ runner.os }}
          path: build/plugin/AruraMelody_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
      - name: Package Windows VST3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem "build/plugin/AruraMelody_artefacts/Release/VST3" -Directory -Filter *.vst3 | Select-Object -First 1
          Compress-Archive -Path $bundle.FullName -DestinationPath AruraMelody-Windows-x64.zip
      - name: Upload release package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AruraMelody-Windows-x64-release
          path: AruraMelody-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AruraMelody-Windows-x64-release
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" AruraMelody-Windows-x64.zip --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
